name: Crypto Conte LIVE - motore autonomo
on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['engine/**', 'tests/**', '.github/workflows/**', 'index.html', 'v3.html', 'manifest.webmanifest', 'sw.js', 'icons/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: crypto-conte-live-engine
  cancel-in-progress: false
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test del motore
        run: python -m unittest discover -s tests -v
      - name: Analisi pubblica dei 20 mercati
        id: scan
        continue-on-error: true
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m engine.scanner
      - name: Salva dati e storico anche in caso di fonte irraggiungibile
        run: |
          git config user.name 'crypto-conte-engine[bot]'
          git config user.email 'crypto-conte-engine@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna analisi e storico Crypto Conte LIVE'
            git push origin HEAD:main
          fi
      - name: Evidenzia copertura incompleta
        if: steps.scan.outcome == 'failure'
        run: exit 1
  publish:
    needs: engine
    if: always() && needs.engine.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepara dashboard e dati pubblici
        run: |
          mkdir -p public/data
          cp index.html v3.html public/
          cp manifest.webmanifest sw.js public/
          cp -r icons public/
          cp data/latest.json public/data/
          cp -r data/archive public/data/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_attempt }}
      - name: Pubblica dashboard
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
